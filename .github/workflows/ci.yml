name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The build fetches the intro text from wp_eins; avoids the 60 req/h limit.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10 # same as nixpacks.toml

      # pyxform checks the workbooks the way Kobo does; ODK Validate needs Java.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - name: End-to-end (formtransform → LimeSurvey TSV, pyxform + ODK Validate)
        run: bun run test:e2e
