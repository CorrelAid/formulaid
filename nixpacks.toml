buildImage = 'ghcr.io/railwayapp/nixpacks:latest'

[phases.setup]
nixPkgs = ["nodejs_24", "bun"]
# Bun 1.3.10
# track latest commit sha: https://github.com/NixOS/nixpkgs/blob/nixpkgs-unstable/pkgs/by-name/bu/bun/package.nix
nixpkgsArchive = '917fec990948658ef1ccd07cef2a1ef060786846'

[phases.install]
dependsOn = ["setup"]
cacheDirectories = [
  "node_modules",
  "node_modules/.cache",
  "/root/.bun/install/cache"]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["bun run build"]
cacheDirectories = [
  "node_modules",
  "node_modules/.cache"
]

[start]
cmd = "bun serve.js"
